<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Sổ Tay Tiếng Thái</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: 232px sidebar on the page colour, one big bordered panel on a dotted ground. Phones: sidebar becomes a bottom tab bar.
   Edges are thick wine-brown lines with hard offset shadows; tone colours (5 hues) stay the system for all Thai text. */
:root{
  --page:#F4DCC0; --bg:#FFF3E2; --dot:#EBCBA6; --surface:#FFFAF3; --surface-2:#F8E4CC; --fg:#3F1A20; --muted:#7A5A55; --line:#E3C6A5;
  --edge:#4B1E26; --ink:#4B1E26; --ink-fg:#FFF3E2; --accent:#C2472F; --accent-soft:#F7C8B0;
  --t-mid:#6A6470; --t-low:#2F63B8; --t-fall:#C2284F; --t-high:#A85A00; --t-rise:#1F7A4D;
  --c-mid:#0C7F82; --c-high:#8A3AA3; --c-low:#8F6209;
  --ok:#1F7A4D; --bad:#C2284F;
  --sh:3px 3px 0 var(--edge);
  --f-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --f-th:'Noto Sans Thai Looped','Noto Sans Thai',Tahoma,sans-serif;
  --f-rom:'Noto Sans','Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#1F0E12; --bg:#2B1419; --dot:#3B1E24; --surface:#381B21; --surface-2:#47242B; --fg:#FBE8D3; --muted:#CDA999; --line:#5C3A3F;
    --edge:#D9A98A; --ink:#F0C7A5; --ink-fg:#2B1419; --accent:#FF9B7A; --accent-soft:#5A2B2B;
    --t-mid:#B8B2C0; --t-low:#7FA9FF; --t-fall:#FF86A8; --t-high:#FFB45E; --t-rise:#5ED3A3;
    --c-mid:#55D1D2; --c-high:#D99DEB; --c-low:#E6B455;
    --ok:#5ED3A3; --bad:#FF86A8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#1F0E12; --bg:#2B1419; --dot:#3B1E24; --surface:#381B21; --surface-2:#47242B; --fg:#FBE8D3; --muted:#CDA999; --line:#5C3A3F;
  --edge:#D9A98A; --ink:#F0C7A5; --ink-fg:#2B1419; --accent:#FF9B7A; --accent-soft:#5A2B2B;
  --t-mid:#B8B2C0; --t-low:#7FA9FF; --t-fall:#FF86A8; --t-high:#FFB45E; --t-rise:#5ED3A3;
  --c-mid:#55D1D2; --c-high:#D99DEB; --c-low:#E6B455;
  --ok:#5ED3A3; --bad:#FF86A8; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font:15px/1.55 var(--f-ui);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-size:1.3rem;font-weight:600;line-height:1.3;text-wrap:balance}
h3{font-size:.95rem;font-weight:600;line-height:1.3}
mark{background:var(--accent-soft);color:var(--fg);padding:0 .3em;border-radius:5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:where(button,input,select,a):focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;align-items:start}
.side{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:4px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-family:var(--f-th);font-size:1.5rem;font-weight:600;flex:none}
.bname{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1;letter-spacing:-.01em}
.bname u{text-decoration:underline wavy var(--accent);text-decoration-thickness:2px;text-underline-offset:6px}
.sec-label{font-size:.72rem;font-weight:600;letter-spacing:.12em;color:var(--muted);padding:2px 10px 6px}
.navv{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-weight:500;padding:11px 14px;border-radius:12px;border:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;text-align:left}
.nv svg{flex:none}
.nv:hover{color:var(--fg);background:var(--surface-2)}
.nv[aria-selected="true"]{background:var(--ink);color:var(--ink-fg);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.mini{background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.mini-t{display:flex;justify-content:space-between;gap:8px}
.panel{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.7px);background-size:22px 22px;
  border:2px solid var(--edge);border-radius:24px;padding:28px;min-height:calc(100vh - 32px);min-width:0}
.vhead{margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
.vhead h2{font-size:1.6rem}
.vhead p{color:var(--muted);max-width:62ch}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);
  border:2px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--edge);padding:28px}
.hero-h{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.5;margin-bottom:10px}
.hero p{color:var(--muted);max-width:48ch;margin-bottom:18px}
.hello{font:inherit;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 12px;border-radius:18px;
  border:2px solid var(--edge);background:var(--accent-soft);box-shadow:var(--sh);cursor:pointer;min-width:0}
.hello .th{font-size:clamp(2.6rem,7vw,4.2rem);line-height:1.3}
.hello .rom{font-size:1.3rem}
.hello .vi{font-weight:400;font-size:.85rem}
.shead{display:flex;align-items:center;gap:14px;margin:30px 0 6px}
.shead::after{content:"";flex:1;border-top:2px solid var(--edge)}
.sub{color:var(--muted);margin-bottom:14px;font-size:.9rem}
.lessons{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.lesson{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:var(--fg);padding:16px;border-radius:14px;
  border:2px solid var(--edge);background:var(--surface);box-shadow:var(--sh);cursor:pointer;min-width:0}
.lesson:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.lesson .ic{width:48px;height:48px;flex:none;border-radius:10px;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center}
.lesson strong{display:block;font-family:var(--f-display);font-size:1.05rem;font-weight:600;line-height:1.25}
.lesson small{color:var(--muted);font-size:.85rem}
.lesson.soon{border:2px dashed var(--line);box-shadow:none;cursor:default;background:transparent;color:var(--muted)}
.lesson.soon:hover{transform:none}
.lesson.soon .ic{background:transparent;color:var(--muted);border:2px solid var(--line)}

/* shared parts */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;
  border:2px solid var(--edge);background:var(--surface);color:var(--fg);cursor:pointer;box-shadow:2px 2px 0 var(--edge)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--ink);color:var(--ink-fg)}
.btn.big{padding:12px 20px;font-size:1rem}
.btn.wide{width:100%;padding:12px 14px}
.btn.icon{padding:7px;line-height:0}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line);transform:none;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn.ok{color:var(--ok)}.btn.no{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--edge);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
input::placeholder{color:var(--muted);opacity:.85}
label{font-size:.85rem;font-weight:500;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 240px;min-width:0}
.bar .field{min-width:0}
.meta{color:var(--muted);font-size:.85rem;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.th{font-family:var(--f-th);font-weight:500;line-height:1.35}
.card .th{font-size:2rem}
.rom{font-family:var(--f-rom);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.dash{color:var(--muted);font-weight:400}
.t-mid{color:var(--t-mid)}.t-low{color:var(--t-low)}.t-fall{color:var(--t-fall)}.t-high{color:var(--t-high)}.t-rise{color:var(--t-rise)}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.vi{font-weight:500}
.ex{border-top:2px dashed var(--line);padding-top:8px;font-size:.88rem;color:var(--muted);display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.ex .th{font-size:1.1rem;color:var(--fg)}
.ex .rom{font-size:.88rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.82rem;font-weight:600;padding:4px 11px;border-radius:99px;
  border:2px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--edge);color:var(--fg)}
.chip.on{background:var(--accent-soft);color:var(--fg);border-color:var(--edge)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:14px}
.form{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:var(--sh);padding:16px;margin-bottom:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.form .full{grid-column:1/-1}
.form .field{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .hint{font-size:.82rem;color:var(--muted)}
.form .prev{min-height:1.6em;font-family:var(--f-rom);font-weight:600}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* flashcards */
.fc-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--fg);font-weight:500}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:300px;padding:24px 16px;
  background:var(--surface);border:2px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--edge);font:inherit;color:var(--fg);text-align:center;cursor:pointer}
.fcard .th.big{font-size:4rem}
.fcard .rom.big{font-size:2rem}
.fcard .hint{font-size:.82rem;color:var(--muted)}
.fcard .exb{border-top:2px dashed var(--line);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:2px;align-items:center;max-width:100%}
.fcard .exb .th{font-size:1.3rem}
.fcard .exb .rom{font-size:.95rem}
.fcard .exb .vi{font-weight:400;color:var(--muted);font-size:.9rem}
.fc-ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:18px}

/* quiz */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin:14px 0}
.mode{text-align:left;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.mode small{color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--accent-soft)}
.prog{height:10px;background:var(--surface);border:2px solid var(--edge);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.qhead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.88rem;margin-bottom:6px}
.qhead+.prog{margin-bottom:16px}
.qbox{background:var(--surface);border:2px solid var(--edge);border-radius:16px;box-shadow:var(--sh);padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px}
.qbox .th{font-size:3rem}
.qbox .ask{color:var(--muted);font-size:.9rem}
.qbox .big-vi{font-size:1.6rem;font-weight:600;font-family:var(--f-display)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--surface);color:var(--fg);cursor:pointer;min-width:0;box-shadow:2px 2px 0 var(--edge)}
.opt:hover:not([aria-disabled="true"]){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--edge)}
.opt[aria-disabled="true"]{cursor:default}
.opt.ok{background:color-mix(in srgb,var(--ok) 20%,var(--surface))}
.opt.bad{background:color-mix(in srgb,var(--bad) 20%,var(--surface))}
.opt .th{font-size:1.5rem}
.optsvg{width:46px;flex:none;line-height:0}
.fb{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--edge);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.fb strong.ok{color:var(--ok)}.fb strong.bad{color:var(--bad)}
.score{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1.2}
.wrong{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.wrong .it{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border:2px solid var(--edge);border-radius:10px}
.wrong .th{font-size:1.4rem}

/* alphabet and tones */
.sec{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.sec:first-child{margin-top:0}
.sec p.note{color:var(--muted);max-width:68ch}
.cls3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.clsbox{background:var(--surface);border:2px solid var(--edge);border-top:6px solid var(--cls);border-radius:14px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.clsbox h3{color:var(--cls)}
.letters{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-th);font-size:1.6rem;line-height:1.4}
.letters .rare{opacity:.45}
.cls-mid{--cls:var(--c-mid)}.cls-high{--cls:var(--c-high)}.cls-low{--cls:var(--c-low)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--edge)}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.tile{font:inherit;color:var(--fg);text-align:center;background:var(--surface);border:2px solid var(--edge);border-top:6px solid var(--cls);border-radius:12px;box-shadow:var(--sh);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.tile .th.big{font-size:2.6rem}
.tile .snd{font-weight:600;font-size:.9rem;color:var(--cls)}
.tile .nm{display:flex;flex-direction:column;align-items:center}
.tile .nm .th{font-size:1.1rem}
.tile .nm .rom{font-size:.8rem}
.tile .vi{font-size:.8rem;color:var(--muted);font-weight:400}
.tcard{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tcard .hd h3{font-size:1.05rem}
.tcard .mk{font-size:.82rem;color:var(--muted)}
.tcard svg{width:100%;max-width:200px;height:auto}
.tcard .eg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:8px}
.tcard .eg .th{font-size:1.6rem}
.gl{stroke:var(--line);stroke-width:1}
.tblwrap{overflow-x:auto;border:2px solid var(--edge);border-radius:14px;box-shadow:var(--sh);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
tr:last-child th,tr:last-child td{border-bottom:0}
thead th{font-size:.82rem;color:var(--muted);font-weight:600}
tbody th{font-family:var(--f-th);font-size:1.3rem;font-weight:500;white-space:nowrap}
tbody th small{font-family:var(--f-ui);font-size:.78rem;color:var(--muted);margin-left:6px}
td{font-weight:600}
.toasts{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:99px;font-size:.9rem;max-width:100%;font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.btn:hover,.lesson:hover,.opt:hover,.tile:hover{transform:none}}


/* additions: vowels, scope bar, tone checker, callout */
.cls-v{--cls:var(--accent)}
.tile .pill{margin-top:2px}
.tile .snd{overflow-wrap:anywhere}
.scopebar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.scopebar select{width:auto;max-width:100%}
.tcbox{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:var(--sh);padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.tcctl{display:flex;flex-direction:column;gap:14px;min-width:0}
.tcctl .g{display:flex;flex-direction:column;gap:6px}
.gl2{font-size:.85rem;font-weight:500;color:var(--muted)}
.tcres{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px;border:2px dashed var(--line);border-radius:12px;min-width:0}
.tcres svg{width:140px;max-width:100%;height:auto}
.tcres .tn{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.2}
.tcres .why{color:var(--muted);font-size:.88rem}
.callout{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-width:76ch}
.callout p{max-width:none}
tbody th .rl{display:block;font-family:var(--f-ui);font-size:.9rem;font-weight:600;white-space:normal}
tbody th small{display:block;margin:0}
thead th small{font-weight:400}
@media (max-width:640px){.tcbox{grid-template-columns:minmax(0,1fr)}}

/* phones: sidebar turns into a bottom tab bar */
@media (max-width:860px){
  body{padding-block:12px calc(88px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;background:var(--surface);border-top:2px solid var(--edge);

  for(i=0;i<n;i++)pts.push((8+i*(84/(n-1)))+','+(52-(lv[i]-1)*11));
  var grid='';for(i=1;i<=5;i++){var y=52-(i-1)*11;grid+='<line class="gl" x1="4" x2="96" y1="'+y+'" y2="'+y+'"/>'}
  var last=pts[n-1].split(',');
  return '<svg viewBox="0 0 100 60" role="img" aria-label="Đường cao độ thanh '+TONES[key].vi+'">'+grid+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="currentColor"/></svg>';
}
/* Thai tone rule. cls: mid|high|low. type: live | ds (dead, short vowel or mid/high dead) | dl (dead, long vowel).
   mark: none | ek | tho | tri | jat. Returns a tone key, or null when the mark is not used with that class. */
function ruleTone(cls,type,mark){
  if(mark==='ek')return cls==='low'?'fall':'low';
  if(mark==='tho')return cls==='low'?'high':'fall';
  if(mark==='tri')return cls==='mid'?'high':null;
  if(mark==='jat')return cls==='mid'?'rise':null;
  if(cls==='mid')return type==='live'?'mid':'low';
  if(cls==='high')return type==='live'?'rise':'low';
  if(type==='live')return 'mid';
  return type==='dl'?'fall':'high';
}

/* ---------- Speech ---------- */
var thVoice=null,voicesReady=false;
function pickVoice(){
  try{var vs=speechSynthesis.getVoices();
    if(vs&&vs.length){voicesReady=true;thVoice=null;
      for(var i=0;i<vs.length;i++){if(/^th([-_]|$)/i.test(vs[i].lang)){thVoice=vs[i];break}}}}catch(e){}
}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
var tt;
function toast(m){var el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},3200)}
function speak(text){
  if(!('speechSynthesis' in window)){toast('Trình duyệt này chưa hỗ trợ đọc thành tiếng.');return}
  pickVoice();
  if(voicesReady&&!thVoice){toast('Thiết bị chưa có giọng tiếng Thái. Hãy thêm giọng Thai trong cài đặt ngôn ngữ của hệ thống.');return}
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=.8;if(thVoice)u.voice=thVoice;speechSynthesis.speak(u)}
  catch(e){toast('Không phát được âm thanh.')}
}

/* ---------- Sound effects (Web Audio, no files) ---------- */
var AC=null;
function ac(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(c,t,f0,f1,dur,type,vol){
  var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(c,t,dur,vol,cut){
  var n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;
  g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
}
function sfx(kind){
  var c=ac();if(!c)return;var t=c.currentTime+0.01;
  try{
    if(kind==='tut'){tone(c,t,1100,1000,0.07,'triangle',0.22)}
    else if(kind==='ding'){tone(c,t,988,988,0.5,'sine',0.28);tone(c,t,1976,1976,0.3,'sine',0.08);tone(c,t+0.3,784,784,0.8,'sine',0.28);tone(c,t+0.3,1568,1568,0.5,'sine',0.08)}
    else if(kind==='pop'){tone(c,t,500,1300,0.14,'square',0.12)}
    else if(kind==='boom'){noise(c,t,0.4,0.8,600);tone(c,t,120,40,0.4,'sine',0.6)}
    else if(kind==='bomb'){tone(c,t,1500,180,0.85,'sine',0.2);noise(c,t+0.85,0.9,0.9,500);tone(c,t+0.85,90,35,0.8,'sine',0.7)}
  }catch(e){}
}

function fco(){

}

function fcRate(r){
  var ws=deckWords();if(!ws.length)return;
  var w=ws[Math.min(S.fc.i,ws.length-1)];
  DB.rate[w.id]=r;if(r>=3)DB.known[w.id]=true;else delete DB.known[w.id];
  save();sfx('tut');S.fc.flip=false;
  if(r>=3&&S.fc.only){var n=deckWords().length;if(S.fc.i>=n)S.fc.i=0;render()}else fcMove(1);
}

  var o=fco();if(!o.auto)return;var ws=deckWords();if(!ws.length)return;

}
function fcMove(d){var n=deckWords().length;if(!n)return;S.fc.i=(S.fc.i+d+n)%n;S.fc.flip=false;render()}
function fcMark(yes){
  var ws=deckWords();if(!ws.length)return;

var MODES=[
 ['meaning','Thái → Việt','Nhìn chữ Thái, chọn nghĩa đúng.'],
 ['thai','Việt → Thái','Đọc nghĩa tiếng Việt, chọn chữ Thái đúng.'],
 ['tone','Thanh điệu','Nhìn và nghe một từ, chọn thanh điệu. Chỉ dùng từ một âm tiết.'],
 ['listen','Nghe và chọn chữ Thái','Nghe phát âm rồi chọn chữ Thái đúng trong 4 đáp án.'],
 ['minpair','Nghe phân biệt thanh','Nghe rồi chọn đúng từ trong các từ chỉ khác thanh điệu, ví dụ ขา, ข่า, ข้า.']
];
function pool(mode){var p=scopeWords();if(mode==='minpair'){var allp=p;p=p.filter(function(w){return minSibs(w,allp).length>0})}if(mode==='tone')p=p.filter(function(w){return sylls(w.rom).length===1});return p}
function makeQs(mode){
  var p=pool(mode),n=Math.min(10,p.length),picks=shuffle(p).slice(0,n),all=scopeWords();
  return picks.map(function(w){
    if(mode==='tone'){return {id:w.id,opts:TONE_KEYS.slice(),ans:TONE_KEYS.indexOf(toneOf(w.rom))}}
    if(mode==='minpair'){var sb=shuffle(minSibs(w,all)).slice(0,3),mo=shuffle([w].concat(sb));return {id:w.id,opts:mo.map(function(x){return x.id}),ans:mo.indexOf(w)}}
    var others=shuffle(all.filter(function(x){return x.id!==w.id})).slice(0,3);
    var opts=shuffle([w].concat(others));
    return {id:w.id,opts:opts.map(function(x){return x.id}),ans:opts.indexOf(w)};
  });
}
function viewQuiz(){
  var Q=S.quiz;
  if(!Q.started){
    var need=Q.mode==='tone'?3:Q.mode==='minpair'?2:4,ok=pool(Q.mode).length>=need;
    return '<div class="sec"><div class="scopebar"><label for="qscope">Bộ từ</label><select id="qscope">'+scopeOpts()+'</select></div>'+
    '<h2>Chọn kiểu bài tập</h2><div class="modes">'+MODES.map(function(m){
      return '<button class="mode" data-a="qMode" data-m="'+m[0]+'" aria-pressed="'+(Q.mode===m[0])+'"><strong>'+m[1]+'</strong><small>'+m[2]+'</small></button>';
    }).join('')+'</div>'+
    '<div class="actions"><button class="btn primary" data-a="qStart"'+(ok?'':' disabled')+'>Bắt đầu</button><span class="meta" style="margin:0">'+(ok?Math.min(10,pool(Q.mode).length)+' câu từ '+pool(Q.mode).length+' từ trong bộ này':'Bộ từ này chưa đủ từ cho kiểu bài này.')+'</span></div></div>';
  }
  if(Q.done){
    var n=Q.qs.length,pct=Math.round(Q.score/n*100);
    return '<div class="sec"><h2>Kết quả</h2><div class="score">'+Q.score+' / '+n+'</div>'+
     '<p class="note">'+(pct===100?'Đúng hết. Thử kiểu bài khác để thêm thử thách.':pct>=70?'Khá tốt. Các từ sai bên dưới nên xem lại.':'Cần ôn thêm. Mở phần Thẻ nhớ để luyện các từ này.')+'</p>'+
     (Q.wrong.length?'<div class="wrong">'+Q.wrong.map(function(id){var w=byId(id);if(!w)return '';
        return '<div class="it"><span class="th" lang="th">'+esc(w.th)+'</span><span class="rom">'+romHTML(w.rom)+'</span><span>'+esc(w.vi)+'</span></div>'}).join('')+'</div>':'')+
     '<div class="actions"><button class="btn primary" data-a="qStart">Làm lại</button><button class="btn" data-a="qReset">Đổi bộ từ hoặc kiểu bài</button></div></div>';
  }
  var q=Q.qs[Q.i],w=byId(q.id),answered=Q.picked!==null,mode=Q.mode;
  var prompt;
  if(mode==='listen'||mode==='minpair')prompt=LPROMPT(w,mode);
  else if(mode==='thai')prompt='<span class="ask">Chữ Thái nào có nghĩa là</span><span class="big-vi">'+esc(w.vi)+'</span>';
  else prompt='<span class="ask">'+(mode==='tone'?'Từ này mang thanh điệu nào?':'Từ này có nghĩa là gì?')+'</span><span class="th" lang="th">'+esc(w.th)+'</span>'+
     '<button class="btn" data-a="say" data-t="'+esc(w.th)+'">'+I.sound+' Nghe</button>';
  var opts=q.opts.map(function(o,i){
    var cls='opt',inner;
    if(mode==='tone')inner='<span class="optsvg t-'+o+'">'+contour(o)+'</span><span><strong>'+TONES[o].vi+'</strong> <small class="dash">('+TONES[o].en+')</small></span>';
    else if(mode==='thai'||mode==='listen'||mode==='minpair')inner='<span class="th" lang="th">'+esc(byId(o).th)+'</span>';
    else inner='<span>'+esc(byId(o).vi)+'</span>';
    if(answered){if(i===q.ans)cls+=' ok';else if(i===Q.picked)cls+=' bad'}
    return '<button class="'+cls+'" data-a="qPick" data-i="'+i+'" aria-disabled="'+answered+'">'+inner+'</button>';
  }).join('');
  var fb='';
  if(answered){var good=Q.picked===q.ans;
    fb='<div class="fb"><span><strong class="'+(good?'ok':'bad')+'">'+(good?'Đúng':'Chưa đúng')+'.</strong> <span class="th" lang="th" style="font-size:1.2rem">'+esc(w.th)+'</span> <span class="rom">'+romHTML(w.rom)+'</span> · '+esc(w.vi)+'</span>'+
       '<button class="btn primary" data-a="qNext">'+(Q.i+1>=Q.qs.length?'Xem kết quả':'Câu tiếp')+'</button></div>';}
  return '<div class="qhead"><span>Câu '+(Q.i+1)+' / '+Q.qs.length+'</span><span>Đúng '+Q.score+'</span></div>'+
    '<div class="prog"><i style="width:'+Math.round((Q.i+(answered?1:0))/Q.qs.length*100)+'%"></i></div>'+
    '<div class="qbox">'+prompt+'</div><div class="opts">'+opts+'</div>'+fb;
}

function cDoneCount(){var c=0;COURSE.forEach(function(L){if(DB.cdone[L.n])c++});return c}
function cMeta(L,sk){
  if(sk==='vocab')return L.w.length+' từ vựng';
  if(sk==='gram')return L.g.length+' điểm ngữ pháp';
  return L.r.length+' phần luyện';
}
function cTabs(sk,act){
  return '<div class="ctabs" role="tablist" aria-label="Kỹ năng">'+CSK.map(function(k){

          '<button class="btn icon ghost" data-a="say" data-t="'+esc(e[0])+'" aria-label="Nghe ví dụ">'+I.sound+'</button></div>'}).join('')+'</article>'}).join('')+'</div>';

   (n<COURSE.length?'<button class="btn" data-a="cOpen" data-n="'+(n+1)+'">Bài '+(n+1)+' '+CHEV+'</button>':'<span></span>')+'</div>';

/* ---------- Listening helpers ---------- */
function tbase(r){return String(r).normalize('NFD').replace(/[̀́̂̌]/g,'').toLowerCase()}
function minSibs(w,all){return all.filter(function(x){return x.id!==w.id&&x.th!==w.th&&tbase(x.rom)===tbase(w.rom)})}
function LPROMPT(w,mode){
  return '<span class="ask">'+(mode==='minpair'?'Nghe kỹ thanh điệu rồi chọn đúng từ':'Nghe và chọn chữ Thái đúng')+'</span><span class="listen-ic" aria-hidden="true">'+I.sound+'</span>'+
    '<button class="btn primary" data-a="say" data-t="'+esc(w.th)+'">'+I.sound+' Nghe lại</button>';
}
function autoSay(){
  var Q=S.quiz;if(!Q.started||Q.done||(Q.mode!=='listen'&&Q.mode!=='minpair'))return;
  var w=byId(Q.qs[Q.i].id);if(w)setTimeout(function(){speak(w.th)},220);
}
/* ---------- Card Blast ---------- */
var BL={state:'idle',raf:0};
function blStop(){if(BL.raf){cancelAnimationFrame(BL.raf);BL.raf=0}}
function viewBlast(){
  if(BL.state==='play'){
    return '<div class="bl-hud"><span>Điểm <b id="bl-score">'+BL.score+'</b></span><span id="bl-lives" aria-label="Mạng còn lại">'+blLives()+'</span><span>Từ <b id="bl-n">'+(BL.n+1)+'</b>/'+BL.total+'</span></div>'+
     '<div class="bl-arena" id="bl-arena"><div class="bl-word" id="bl-word" lang="th"></div><div class="bl-floor"></div></div>'+
     '<div class="opts bl-opts" id="bl-opts"></div><p class="meta" style="margin-top:8px">Bấm đáp án hoặc phím 1 đến 4 trước khi chữ chạm đáy.</p>';
  }
  if(BL.state==='end'){
    return '<div class="sec"><h2>'+(BL.lives>0?'Hoàn thành':'Hết mạng')+'</h2><div class="score">'+BL.score+' điểm</div>'+
     '<p class="note">Bắn hạ '+BL.hits+' trên '+BL.n+' từ'+(BL.wrong.length?'. Các từ cần ôn:':'. Không sai từ nào.')+'</p>'+
     (BL.wrong.length?'<div class="wrong">'+BL.wrong.map(function(id){var w=byId(id);if(!w)return '';
       return '<div class="it"><span class="th" lang="th">'+esc(w.th)+'</span><span class="rom">'+romHTML(w.rom)+'</span><span>'+esc(w.vi)+'</span></div>'}).join('')+'</div>':'')+
     '<div class="actions"><button class="btn primary" data-a="blStart">Chơi lại</button><button class="btn" data-a="blReset">Đổi bộ từ</button></div></div>';
  }
  var n=scopeWords().length;
  return '<div class="sec"><div class="scopebar"><label for="blscope">Bộ từ</label><select id="blscope">'+scopeOpts()+'</select></div>'+
   '<h2>Chữ rơi xuống, bạn bắn hạ</h2><p class="note">Một từ Thái rơi từ trên xuống. Chọn nghĩa đúng trước khi nó chạm đáy. Có 3 mạng, chữ rơi nhanh dần.</p>'+
   '<div class="actions"><button class="btn primary" data-a="blStart"'+(n>=4?'':' disabled')+'>Bắt đầu</button><span class="meta" style="margin:0">'+(n>=4?Math.min(15,n)+' từ trong lượt này':'Bộ từ này chưa đủ 4 từ.')+'</span></div></div>';
}
function blLives(){var s='';for(var i=0;i<3;i++)s+='<span class="'+(i<BL.lives?'hp':'hp off')+'">●</span>';return s}
function blStart(){
  var p=shuffle(scopeWords());if(p.length<4)return;
  BL={state:'play',all:scopeWords(),pool:p.slice(0,15),total:Math.min(15,p.length),n:0,score:0,hits:0,lives:3,cur:null,y:0,last:0,raf:0,wrong:[],locked:false,streak:0,bad:{}};
  S.tab='blast';render();blNext();BL.last=performance.now();BL.raf=requestAnimationFrame(blTick);
}
function blNext(){
  if(BL.n>=BL.total){blEnd();return}
  var w=BL.pool[BL.n];BL.cur=w;BL.y=0;BL.bad={};BL.locked=false;
  var others=shuffle(BL.all.filter(function(x){return x.id!==w.id&&x.vi!==w.vi})).slice(0,3);
  BL.opts=shuffle([w].concat(others));
  var el=$('#bl-word');if(el){el.textContent=w.th;el.className='bl-word';el.style.top='0px'}
  var o=$('#bl-opts');if(o)o.innerHTML=BL.opts.map(function(x,i){return '<button class="opt" data-a="blPick" data-i="'+i+'"><span class="k">'+(i+1)+'</span><span>'+esc(x.vi)+'</span></button>'}).join('');
  var nn=$('#bl-n');if(nn)nn.textContent=BL.n+1;
}
function blHud(){var s=$('#bl-score');if(s)s.textContent=BL.score;var l=$('#bl-lives');if(l)l.innerHTML=blLives()}
function blTick(t){
  if(BL.state!=='play')return;
  var dt=Math.min(.05,(t-BL.last)/1000);BL.last=t;
  var ar=$('#bl-arena'),el=$('#bl-word');
  if(ar&&el&&!BL.locked){
    var speed=42+BL.n*5;BL.y+=speed*dt;
    var floor=ar.clientHeight-el.offsetHeight-6;el.style.top=Math.min(BL.y,floor)+'px';
    if(BL.y>=floor)blMiss();
  }
  BL.raf=requestAnimationFrame(blTick);
}
function blMiss(){
  if(BL.locked)return;BL.locked=true;sfx('boom');BL.lives--;BL.streak=0;BL.wrong.push(BL.cur.id);blHud();
  var el=$('#bl-word');if(el)el.className='bl-word miss';
  var o=document.querySelectorAll('#bl-opts .opt');BL.opts.forEach(function(x,i){if(x.id===BL.cur.id&&o[i])o[i].classList.add('ok')});
  setTimeout(function(){if(BL.state!=='play')return;if(BL.lives<=0)blEnd();else{BL.n++;blNext()}},900);
}
function blPick(i){
  if(BL.state!=='play'||BL.locked||BL.bad[i])return;
  var x=BL.opts[i];if(!x)return;
  var btns=document.querySelectorAll('#bl-opts .opt');
  if(x.id===BL.cur.id){
    BL.locked=true;sfx('pop');BL.hits++;BL.streak++;BL.score+=10+Math.min(BL.streak,5)*2;blHud();
    if(btns[i])btns[i].classList.add('ok');
    var el=$('#bl-word');if(el)el.className='bl-word hit';
    setTimeout(function(){if(BL.state!=='play')return;BL.n++;blNext()},420);
  }else{
    sfx('boom');BL.bad[i]=true;BL.streak=0;BL.lives--;if(BL.wrong.indexOf(BL.cur.id)<0)BL.wrong.push(BL.cur.id);
    if(btns[i]){btns[i].classList.add('bad');btns[i].setAttribute('aria-disabled','true')}
    blHud();if(BL.lives<=0){BL.locked=true;setTimeout(blEnd,500)}
  }
}
function blEnd(){blStop();BL.state='end';render();window.scrollTo(0,0)}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,d=el.dataset;
  switch(a){
    case 'tab':if(d.tab==='course')S.course.view='home';S.tab=d.tab;render();window.scrollTo(0,0);break;
    case 'go':
      if(d.tab==='course')S.course.view='home';
      if(d.level){S.level=d.level;S.topic='all'}
      S.tab=d.tab;render();window.scrollTo(0,0);break;
    case 'say':speak(d.t);break;
    case 'addWord':S.tab='notebook';S.formOpen=true;render();window.scrollTo(0,0);var ff=$('#f-th');if(ff)ff.focus();break;
    case 'toggleForm':S.formOpen=!S.formOpen;render();if(S.formOpen){var f=$('#f-th');if(f)f.focus()}break;
    case 'known':if(DB.known[d.id])delete DB.known[d.id];else DB.known[d.id]=true;save();updateList();break;
    case 'vknown':if(DB.known[d.id])delete DB.known[d.id];else DB.known[d.id]=true;save();keepScroll(render);break;
    case 'del':
      var gone=DB.custom.filter(function(w){return w.id===d.id})[0];
      if(gone&&gone.src)delete DB.saved[gone.src];
      DB.custom=DB.custom.filter(function(w){return w.id!==d.id});delete DB.known[d.id];save();updateList();toast('Đã xóa từ.');break;
    case 'saveWord':
      var lw=byId(d.id);if(!lw||DB.saved[d.id])break;
      DB.custom.push({id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1000),th:lw.th,rom:lw.rom,vi:lw.vi,pos:lw.pos,src:lw.id});
      DB.saved[d.id]=true;save();keepScroll(render);toast('Đã lưu “'+lw.th+'” vào sổ tay.');break;
    case 'blStart':blStart();break;
    case 'blPick':blPick(parseInt(d.i,10));break;
    case 'blReset':blStop();BL.state='idle';render();break;
    case 'cSkill':S.course.skill=d.sk;keepScroll(render);break;
    case 'cLSkill':S.course.skill=d.sk;keepScroll(render);break;
    case 'cOpen':S.course.view='lesson';S.course.n=parseInt(d.n,10);S.tab='course';render();window.scrollTo(0,0);break;
    case 'cBack':S.course.view='home';render();window.scrollTo(0,0);break;
    case 'cDone':var cn=S.course.n;if(DB.cdone[cn])delete DB.cdone[cn];else DB.cdone[cn]=true;save();keepScroll(render);break;
    case 'cReviewCards':S.scope='k'+S.course.n;S.fc={deck:[],i:0,flip:false,only:false};S.tab='cards';render();window.scrollTo(0,0);break;
    case 'cReviewQuiz':S.scope='k'+S.course.n;S.quiz.started=false;S.quiz.done=false;S.tab='quiz';render();window.scrollTo(0,0);break;
    case 'level':S.level=d.l;S.topic='all';keepScroll(render);break;
    case 'topic':S.topic=d.i==='all'?'all':parseInt(d.i,10);keepScroll(render);break;
    case 'reviewCards':S.scope=S.level;S.fc={deck:[],i:0,flip:false,only:false};S.tab='cards';render();window.scrollTo(0,0);break;
    case 'reviewQuiz':S.scope=S.level;S.quiz.started=false;S.quiz.done=false;S.tab='quiz';render();window.scrollTo(0,0);break;
    case 'fcFlip':S.fc.flip=!S.fc.flip;render();break;
    case 'fcRate':fcRate(parseInt(d.r,10));break;
    case 'fcOpt':var oo=fco(),kk=d.k;
      if(kk==='front'){oo.front=oo.front==='th'?'vi':'th';S.fc.flip=false}
      else if(kk==='shuffle'){S.fc.deck=shuffle(scopeWords().map(function(w){return w.id}));S.fc.i=0;S.fc.flip=false}
      else if(kk==='color')oo.color=(oo.color+1)%4;
      else oo[kk]=!oo[kk];
      fcoSave();render();break;
    case 'fcMode':
      if(d.m==='quiz'){S.quiz.started=false;S.quiz.done=false;S.tab='quiz'}
      else if(d.m==='listen'){S.quiz.mode='listen';S.quiz.started=false;S.quiz.done=false;S.tab='quiz'}
      else if(d.m==='blast'){BL.state='idle';S.tab='blast'}
      render();window.scrollTo(0,0);break;
    case 'fcPrev':sfx('tut');fcMove(-1);break;
    case 'fcNext':sfx('tut');fcMove(1);break;
    case 'fcYes':sfx('tut');fcMark(true);break;
    case 'fcNo':sfx('tut');fcMark(false);break;
    case 'fcShuffle':S.fc.deck=shuffle(scopeWords().map(function(w){return w.id}));S.fc.i=0;S.fc.flip=false;render();break;
    case 'resetKnown':scopeWords().forEach(function(w){delete DB.known[w.id]});save();S.fc.only=false;S.fc.i=0;render();break;
    case 'qMode':S.quiz.mode=d.m;render();break;
    case 'qStart':var m=S.quiz.mode;S.quiz={mode:m,started:true,done:false,qs:makeQs(m),i:0,score:0,picked:null,wrong:[]};render();autoSay();break;
    case 'qReset':S.quiz.started=false;S.quiz.done=false;render();break;
    case 'qPick':
      var Q=S.quiz;if(Q.picked!==null)break;
      Q.picked=parseInt(d.i,10);var qq=Q.qs[Q.i];
      if(Q.picked===qq.ans){Q.score++;sfx('ding')}else{Q.wrong.push(qq.id);sfx('bomb')}
      render();break;
    case 'qNext':
      var Q2=S.quiz;Q2.i++;Q2.picked=null;if(Q2.i>=Q2.qs.length)Q2.done=true;render();window.scrollTo(0,0);autoSay();break;
    case 'aFilter':S.alpha=d.f;keepScroll(render);break;
    case 'vFilter':S.vf=d.f;keepScroll(render);break;
    case 'tc':S.tc[d.k]=d.v;keepScroll(render);break;
  }
});

  var t=e.target;
  if(t.id==='q'){S.q=t.value;updateList()}
  else if(t.id==='f-rom'){var p=$('#f-prev');if(p)p.innerHTML=t.value.trim()?romHTML(t.value):''}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='flt'){S.filter=t.value;updateList()}
  else if(t.id==='fc-only'){S.fc.only=t.checked;S.fc.i=0;S.fc.flip=false;render();var c=$('#fc-only');if(c)c.focus()}
  else if(t.id==='fcscope'){S.scope=t.value;S.fc={deck:[],i:0,flip:false,only:false};render();var s1=$('#fcscope');if(s1)s1.focus()}
  else if(t.id==='blscope'){S.scope=t.value;render();var s3=$('#blscope');if(s3)s3.focus()}
  else if(t.id==='qscope'){S.scope=t.value;S.quiz.started=false;S.quiz.done=false;render();var s2=$('#qscope');if(s2)s2.focus()}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='add-form')return;
  e.preventDefault();
  var f=e.target,g=function(n){return f.elements[n].value.trim()};
  var th=g('th'),rom=g('rom'),vi=g('vi'),err=$('#f-err');
  if(!th||!rom||!vi){err.textContent='Hãy điền chữ Thái, phiên âm và nghĩa tiếng Việt.';return}
  if(!/[฀-๿]/.test(th)){err.textContent='Ô “Chữ Thái” cần có ký tự tiếng Thái.';return}
  var w={id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1000),th:th,rom:rom,vi:vi,pos:g('pos')};
  if(g('eth'))w.ex={th:g('eth'),rom:g('erom'),vi:g('evi')};
  DB.custom.push(w);save();
  S.formOpen=false;S.q='';S.filter='all';render();
  toast('Đã thêm “'+th+'” vào sổ tay.');
});
document.addEventListener('keydown',function(e){
  if(S.tab==='blast'&&BL.state==='play'&&/^[1-4]$/.test(e.key)){blPick(parseInt(e.key,10)-1);return}
  if(S.tab!=='cards')return;
  var tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(e.key==='ArrowRight'){fcMove(1)}else if(e.key==='ArrowLeft'){fcMove(-1)}
  else if(e.key===' '&&tag!=='BUTTON'){e.preventDefault();S.fc.flip=!S.fc.flip;render()}
  else if(/^[1-4]$/.test(e.key)){fcRate(parseInt(e.key,10))}
});

buildSide();
render();
})();

</script>
</body></html>
